name: Update Org Profile README

on:
  # 手动触发（在 GitHub Actions 页面点 "Run workflow" 即可）
  workflow_dispatch:
  # 每周一凌晨自动更新
  schedule:
    - cron: '0 0 * * 1'
  # 当有新 repo 被 fork/创建时也可以触发
  repository_dispatch:
    types: [update-profile]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate profile README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet || (git commit -m "docs: auto-update profile README with latest repo stats" && git push)
